<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeelingTheWord</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div class="card">
            <header class="card-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <h1 class="title">FeelingTheWord</h1>
                <p class="subtitle">Share what's on your heart and receive encouragement through Scripture.</p>
            </header>

            <section class="input-section" id="inputSection">
                <label for="feelingInput" class="input-label">How are you feeling today?</label>
                <textarea 
                    id="feelingInput" 
                    class="feeling-textarea" 
                    placeholder="I feel anxious and overwhelmed..."
                    rows="3"
                ></textarea>
                <button type="button" class="receive-button" id="receiveButton">
                    <span class="button-text">Receive a Verse</span>
                    <span class="button-loader" id="buttonLoader"></span>
                </button>
            </section>

            <section class="result-section" id="resultSection">
                <div class="verse-container">
                    <p class="verse-text" id="verseText"></p>
                    <p class="verse-reference" id="verseReference"></p>
                    <div class="result-actions">
                        <button class="action-button secondary" id="copyButton">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="9" y="9" width="13" height="13" rx="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            <span>Copy</span>
                        </button>
                        <button class="action-button primary" id="newButton">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M23 4v6h-6M1 20v-6h6"/>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                            </svg>
                            <span>Another Verse</span>
                        </button>
                    </div>
                </div>
            </section>

            <footer class="card-footer">
                <p>Coded by Will</p>
            </footer>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
